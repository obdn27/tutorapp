services:
  db:
    image: tutorapp-postgres
    container_name: db
    build: ./postgres-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - tutorapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: tutorapp-backend
    container_name: backend
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/postgres?sslmode=require
      PEPPER: ${BACKEND_PEPPER}
      JWT_SECRET: ${BACKEND_JWT_SECRET}
      CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      -  tutorapp-network

networks:
  tutorapp-network:
    driver: bridge